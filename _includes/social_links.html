<div class="social-icons">
    {% for link in site.data.social %}
    <a class="icon" target="_blank" rel="noopener" href="{{ link.link }}"{% if link.title %} title="{{ link.title }}"{% endif %}>{% if link.icon %}<i class="fa {{ link.icon }}"></i>{% else %}<span class="icon-text">{{ link.text }}</span>{% endif %}</a>
    {% endfor %}
</div>
