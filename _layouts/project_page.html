---
layout: default
---
{% assign project = site.data.projects | where: "id", page.project_id | first %}
<article class="post">
  <p class="project-meta">{{ project.date }} · {{ project.tags | join: " · " }}</p>
  <div class="post-content">
    {{ content }}
    {% if page.github_url %}
    <p><a href="{{ page.github_url }}">Source code on GitHub</a></p>
    {% endif %}
    <p><a href="/projects">&larr; All projects</a></p>
  </div>
</article>
